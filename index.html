<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đế chế D3KT</title>
<meta name="author" content="TieuPhuong28">
<meta name="copyright" content="© 2026 TieuPhuong28. Bảo lưu mọi quyền.">

<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="top"></header>
<div id="main">
  <div id="mid">
    <div id="mapwrap">
      <canvas id="cv"></canvas>
    </div>
    <!-- Thanh dọc bên phải: dân làng và đạo quân (đang chọn, lệnh, danh sách) -->
    <aside id="side"></aside>
    <div id="toasts"></div>
    <!-- Cửa sổ cây kỹ thuật (chỉ để xem), mở bằng nút 🔧 trên thanh dọc hoặc phím T -->
    <div id="techwin"></div>
  </div>
  <!-- Bảng điều khiển ngang dưới đáy: đang chọn · lệnh · ô dưới chuột / nhật ký · bản đồ con -->
  <footer id="bottom">
    <button id="bottomtoggle" class="btn" data-act="panel" title="Thu gọn / mở bảng điều khiển (phím B)">▾ Thu gọn</button>
    <section id="selbox" class="pane"></section>
    <section id="cmdbox" class="pane"></section>
    <section id="infobox" class="pane"></section>
    <section id="minibox"><canvas id="mini" title="Bản đồ con — phím M để ẩn/hiện"></canvas></section>
  </footer>
</div>
<div id="overlay"></div>
<script src="default-config.js"></script>
<script src="game.js"></script>
</body>
</html>
